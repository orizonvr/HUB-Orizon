<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#052c1e" />
    </linearGradient>
    <linearGradient id="face1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d" />
      <stop offset="100%" stop-color="#f6ad55" />
    </linearGradient>
    <linearGradient id="suit1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="tie1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="160" height="160" rx="80" fill="url(#bg1)" />
  <circle cx="80" cy="80" r="76" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3" />
  
  <!-- Suit / Shoulders -->
  <path d="M28 160 C32 122 52 110 80 110 C108 110 128 122 132 160 Z" fill="url(#suit1)" />
  <!-- Shirt -->
  <path d="M66 110 L80 134 L94 110 Z" fill="#ffffff" />
  <!-- Tie -->
  <polygon points="76,118 84,118 82,150 80,154 78,150" fill="url(#tie1)" />
  <!-- Lapel lines -->
  <path d="M50 118 L72 142" stroke="#334155" stroke-width="2" />
  <path d="M110 118 L88 142" stroke="#334155" stroke-width="2" />
  
  <!-- Neck -->
  <rect x="71" y="86" width="18" height="26" rx="4" fill="#ed8936" opacity="0.8" />
  <!-- Head / Face -->
  <ellipse cx="80" cy="68" rx="26" ry="32" fill="url(#face1)" />
  
  <!-- Hair (Modern executive side-part) -->
  <path d="M52 64 C52 42 64 36 80 36 C96 36 108 42 108 64 C104 52 98 46 80 46 C66 46 58 54 52 64 Z" fill="#2d3748" />
  <!-- Glasses / Modern look -->
  <rect x="61" y="62" width="14" height="10" rx="3" fill="none" stroke="#1e293b" stroke-width="2" />
  <rect x="85" y="62" width="14" height="10" rx="3" fill="none" stroke="#1e293b" stroke-width="2" />
  <line x1="75" y1="67" x2="85" y2="67" stroke="#1e293b" stroke-width="2" />
  
  <!-- Smile -->
  <path d="M74 84 Q80 88 86 84" fill="none" stroke="#c05621" stroke-width="2" stroke-linecap="round" />
</svg>
